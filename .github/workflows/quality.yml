name: RM quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check assets/rm.js
          node --check experiences/image-stack/script.js
          node --check experiences/cube-3d/script.js
      - name: Check offline asset paths
        run: python3 scripts/check-assets.py
